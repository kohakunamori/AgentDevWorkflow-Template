name: Feature request
description: Propose a scoped product capability
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User-visible outcome
      description: Describe the benefit, not just a code change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include measurable normal, edge and error cases.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, exclusions and dependencies
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions requiring maintainer review

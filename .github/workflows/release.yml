name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate and rerun full checks
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Release must run from main"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid version"; exit 1; }
          git fetch origin main --tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "Stale main"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag already exists"; exit 1
          fi
          python -m unittest discover -s tests -v
          python scripts/check_template.py
          git archive --format=zip --prefix="agentdevworkflow-$VERSION/" -o "agentdevworkflow-$VERSION.zip" HEAD
      - name: Create GitHub release only after checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "agentdevworkflow-$VERSION.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "v$VERSION"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url,assets

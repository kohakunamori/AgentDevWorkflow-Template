name: Agent implement

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved Issue number to implement
        required: true
        type: string

permissions: {}

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read approved Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,title,body,comments,labels,state > agent-context.json
      - name: Generate candidate changes (no GitHub write token)
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: agents/IMPLEMENT.md
      - name: Package generated patch
        run: |
          git add -N -- src tests docs examples
          git diff --binary HEAD -- src tests docs examples > agent.patch
          python scripts/verify_agent_patch.py agent.patch
      - uses: actions/upload-artifact@v4
        with:
          name: implementation-patch
          path: agent.patch
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: implementation-patch
      - name: Validate, apply, commit and push a guarded patch
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          python scripts/verify_agent_patch.py agent.patch
          git apply --check agent.patch
          git apply --index agent.patch
          python scripts/verify_agent_patch.py --staged verify
          if git diff --cached --quiet; then
            echo "No proposed source changes" >&2
            exit 1
          fi
          branch="agent/issue-$ISSUE_NUMBER-run-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "agent: propose fix for issue #$ISSUE_NUMBER"
          git push origin "$branch"
      - name: Open Draft PR (never auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          branch="agent/issue-$ISSUE_NUMBER-run-$GITHUB_RUN_ID"
          cat > /tmp/pr.md <<EOF
          Agent-generated implementation proposal for Issue #$ISSUE_NUMBER.

          Closes #$ISSUE_NUMBER

          **Status:** Draft; untrusted generated code. Requires deterministic CI, independent review, and human authorization before merging.

          **Verification:** See CI logs and review the changed tests. A coding agent's own claims are not evidence of successful runtime verification.

          **Security:** The publisher only accepted changes under src/, tests/, docs/ and examples/.
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$branch" --title "Agent proposal: Issue #$ISSUE_NUMBER" --body-file /tmp/pr.md

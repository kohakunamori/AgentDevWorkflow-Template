name: Agent triage
run-name: "Triage Issue #${{ inputs.issue_number || github.event.issue.number }}"

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing GitHub Issue number
        required: true
        type: string

concurrency:
  group: "agent-triage-issue-${{ inputs.issue_number || github.event.issue.number }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AGENT_AUTOMATION_ENABLED == 'true' &&
       github.event_name == 'issues' &&
       ((github.event.action == 'labeled' &&
         github.event.label.name == 'agent:triage') ||
        ((github.event.action == 'opened' || github.event.action == 'reopened') &&
         (github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'))))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      issue_number: ${{ steps.context.outputs.issue_number }}
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: context
        name: Read issue data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,comments,labels,state > agent-context.json
      - id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: agents/TRIAGE.md

  post:
    needs: analyze
    if: needs.analyze.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post triage findings (not an implementation authorization)
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.analyze.outputs.issue_number }}
          AGENT_MESSAGE: ${{ needs.analyze.outputs.final_message }}
        shell: bash
        run: |
          printf '%s\n' "$AGENT_MESSAGE" > /tmp/triage.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/triage.md
